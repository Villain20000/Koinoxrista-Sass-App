services:
  db:
    # pgvector build of Postgres 16 — adds the `vector` extension for the RAG
    # embeddings table (docs/LANGCHAIN_LANGGRAPH_PLAN.md, Phase 1).
    image: pgvector/pgvector:pg16
    container_name: polyos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: polykatoikiaos
    ports:
      - "5432:5432"
    volumes:
      - polyos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  polyos_pgdata:
